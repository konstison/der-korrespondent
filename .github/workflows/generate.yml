name: Tägliche Ausgabe generieren

on:
  schedule:
    # 04:15 UTC = 05:15 Uhr MEZ / 06:15 Uhr MESZ
    - cron: '15 4 * * *'
  workflow_dispatch: # manueller Start über den Actions-Tab
    inputs:
      schluessel:
        description: 'automatisch = erst kostenlos, bezahlt nur als Ausweichlösung; bezahlt / frei = nur dieser Schlüssel'
        type: choice
        options: [automatisch, bezahlt, frei]
        default: automatisch
      modus:
        description: 'kompakt = 5 Essays auf Deutsch + Glosse (Standard); advanced = 8 Ressorts + Englisch'
        type: choice
        options: [kompakt, advanced]
        default: kompakt
      testlauf:
        description: 'Testlauf: nur erzeugen und Kosten messen, nichts veröffentlichen'
        type: boolean
        default: false

permissions:
  contents: write

# Verhindert, dass zwei Läufe gleichzeitig schreiben
concurrency:
  group: tagesausgabe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Ausgabe generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          SCHLUESSEL: ${{ inputs.schluessel || vars.SCHLUESSEL || 'automatisch' }}
          MODUS: ${{ inputs.modus || vars.MODUS || 'kompakt' }}
        run: python scripts/generate_edition.py

      - name: Statische Seiten bauen (Essays, Archiv, Dossiers, Feed, Sitemap)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://konstison.github.io/der-korrespondent' }}
        run: python scripts/build_site.py

      - name: Nutzungsbericht
        if: always()
        run: test -f data/nutzung.json && tail -c 1500 data/nutzung.json || true

      - name: Ausgabe & Archiv veröffentlichen
        if: ${{ !inputs.testlauf }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Tagesausgabe $(TZ=Europe/Berlin date +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
